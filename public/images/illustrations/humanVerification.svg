" /></circle><path d="M-26 2 l16 18 l36 -40" stroke="#34d399" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="200" y="520" width="440" height="10" rx="5" fill="#16263e"/><rect x="200" y="520" width="440" height="10" rx="5" fill="#2dd4ff"><animate attributeName="width" values="40;440;440" dur="3s" begin="0s" repeatCount="indefinite" /></rect><circle cx="200" cy="525" r="11" fill="#2dd4ff"/><text x="200" y="556" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#cfe9ff">Detect</text><circle cx="350" cy="525" r="11" fill="#2dd4ff"/><text x="350" y="556" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#cfe9ff">Verify</text><circle cx="500" cy="525" r="11" fill="#2dd4ff"/><text x="500" y="556" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#cfe9ff">Alert</text><g transform="translate(1075 150)"><circle r="46" fill="#0a1220" stroke="#2dd4ff" stroke-width="3"/><path d="M-22 6 v-10 a22 22 0 0 1 44 0 v10" fill="none" stroke="#2dd4ff" stroke-width="5" stroke-linecap="round"/><rect x="-30" y="-2" width="12" height="22" rx="5" fill="#2dd4ff"/><rect x="18" y="-2" width="12" height="22" rx="5" fill="#2dd4ff"/></g><g transform="translate(1075 270)"><circle r="46" fill="#0a1220" stroke="#34d399" stroke-width="3"/><text y="9" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="26" fill="#34d399">24/7</text></g><g><rect x="70" y="90" width="479" height="46" rx="23" fill="#061427" fill-opacity=".88" stroke="#34d399" stroke-width="2"/><circle cx="94" cy="113" r="7" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" begin="0s" repeatCount="indefinite" /></circle><text x="112" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff">Verified by a trained analyst</text></g><rect width="1200" height="800" fill="url(#vig)"/></svg>