eze"/><animate attributeName="y" values="420;270" dur="1.4s" fill="freeze"/></rect><path d="M80 80 L700 330" stroke="#34d399" stroke-width="6" stroke-dasharray="16 12" fill="none"><animate attributeName="stroke-dashoffset" values="56;0" dur="2s" repeatCount="indefinite"/></path><g><g><rect x="450" y="30" width="299" height="46" rx="23" fill="#061427" fill-opacity=".88" stroke="#34d399" stroke-width="2"/><circle cx="474" cy="53" r="7" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" begin="0s" repeatCount="indefinite" /></circle><text x="492" y="61" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff">Cost per camera ↓</text></g></g></g><text x="600" y="700" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#34d399">−60% operating cost</text><rect width="1200" height="800" fill="url(#vig)"/></svg>