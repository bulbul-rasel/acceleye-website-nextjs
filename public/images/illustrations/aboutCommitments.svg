<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="AccelEye commitments"><title>AccelEye commitments</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset=".55" stop-color="#0a2140"/><stop offset="1" stop-color="#0b3a5e"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#06101d"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a47"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa5bd"/><stop offset=".5" stop-color="#4b6179"/><stop offset="1" stop-color="#26374b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c42"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3150"/><stop offset="1" stop-color="#061427"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#2dd4ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030812" stop-opacity=".0"/><stop offset="1" stop-color="#030812" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2dd4ff" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><circle cx="210" cy="400" r="86" fill="#061427" stroke="#2dd4ff" stroke-width="5"/><circle cx="210" cy="400" r="86" fill="url(#glow)" opacity=".4"/><text x="210" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#2dd4ff" opacity="1">1</text><text x="210" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#fff" opacity="1">Accuracy</text><circle cx="210" cy="400" r="86" fill="none" stroke="#2dd4ff" stroke-width="3"><animate attributeName="r" values="86;223.6" dur="4s" begin="0.0s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="4s" begin="0.0s" repeatCount="indefinite" /></circle><circle cx="470" cy="400" r="86" fill="#061427" stroke="#34d399" stroke-width="5"/><circle cx="470" cy="400" r="86" fill="url(#glow)" opacity=".4"/><text x="470" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#34d399" opacity="1">2</text><text x="470" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#fff" opacity="1">Privacy</text><circle cx="470" cy="400" r="86" fill="none" stroke="#34d399" stroke-width="3"><animate attributeName="r" values="86;223.6" dur="4s" begin="0.7s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="4s" begin="0.7s" repeatCount="indefinite" /></circle><circle cx="730" cy="400" r="86" fill="#061427" stroke="#fbbf24" stroke-width="5"/><circle cx="730" cy="400" r="86" fill="url(#glow)" opacity=".4"/><text x="730" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#fbbf24" opacity="1">3</text><text x="730" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#fff" opacity="1">Speed</text><circle cx="730" cy="400" r="86" fill="none" stroke="#fbbf24" stroke-width="3"><animate attributeName="r" values="86;223.6" dur="4s" begin="1.4s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="4s" begin="1.4s" repeatCount="indefinite" /></circle><circle cx="990" cy="400" r="86" fill="#061427" stroke="#ff4d5e" stroke-width="5"/><circle cx="990" cy="400" r="86" fill="url(#glow)" opacity=".4"/><text x="990" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#ff4d5e" opacity="1">4</text><text x="990" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#fff" opacity="1">Humans</text><circle cx="990" cy="400" r="86" fill="none" stroke="#ff4d5e" stroke-width="3"><animate attributeName="r" values="86;223.6" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite" /></circle><rect width="1200" height="800" fill="url(#vig)"/></svg>