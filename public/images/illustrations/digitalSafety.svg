<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Digital safety and wellness"><title>Digital safety and wellness</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset=".55" stop-color="#0a2140"/><stop offset="1" stop-color="#0b3a5e"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#06101d"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a47"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa5bd"/><stop offset=".5" stop-color="#4b6179"/><stop offset="1" stop-color="#26374b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c42"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3150"/><stop offset="1" stop-color="#061427"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#2dd4ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030812" stop-opacity=".0"/><stop offset="1" stop-color="#030812" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2dd4ff" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><g transform="translate(250 170)"><rect width="700" height="440" rx="22" fill="#07162a" stroke="#2c4666" stroke-width="3"/><circle cx="150" cy="170" r="70" fill="none" stroke="#1c3a5c" stroke-width="16"/><circle cx="150" cy="170" r="70" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 440" transform="rotate(-90 150 170)"><animate attributeName="stroke-dasharray" values="0 440;200 440" dur="2.4s" begin="0s" repeatCount="indefinite" /></circle><text x="150" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff" opacity="1">82%</text><text x="150" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#b6cde6" opacity="1">Mood</text><circle cx="350" cy="170" r="70" fill="none" stroke="#1c3a5c" stroke-width="16"/><circle cx="350" cy="170" r="70" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 440" transform="rotate(-90 350 170)"><animate attributeName="stroke-dasharray" values="0 440;260 440" dur="2.4s" begin="0s" repeatCount="indefinite" /></circle><text x="350" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff" opacity="1">18%</text><text x="350" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#b6cde6" opacity="1">Risk</text><circle cx="550" cy="170" r="70" fill="none" stroke="#1c3a5c" stroke-width="16"/><circle cx="550" cy="170" r="70" fill="none" stroke="#2dd4ff" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 440" transform="rotate(-90 550 170)"><animate attributeName="stroke-dasharray" values="0 440;320 440" dur="2.4s" begin="0s" repeatCount="indefinite" /></circle><text x="550" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff" opacity="1">91%</text><text x="550" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#b6cde6" opacity="1">Focus</text><path d="M40 380 C140 330 200 400 300 350 S 480 320 660 360" fill="none" stroke="#2dd4ff" stroke-width="5"><animate attributeName="stroke-dasharray" values="0 900;900 0" dur="3s" begin="0s" repeatCount="indefinite" /></path></g><g><rect x="430" y="640" width="434" height="46" rx="23" fill="#061427" fill-opacity=".88" stroke="#34d399" stroke-width="2"/><circle cx="454" cy="663" r="7" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" begin="0s" repeatCount="indefinite" /></circle><text x="472" y="671" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff">Digital wellness analytics</text></g><rect width="1200" height="800" fill="url(#vig)"/></svg>