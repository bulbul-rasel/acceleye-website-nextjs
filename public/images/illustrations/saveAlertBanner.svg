<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="How SaveAlert works"><title>How SaveAlert works</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset=".55" stop-color="#0a2140"/><stop offset="1" stop-color="#0b3a5e"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#06101d"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a47"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa5bd"/><stop offset=".5" stop-color="#4b6179"/><stop offset="1" stop-color="#26374b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c42"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3150"/><stop offset="1" stop-color="#061427"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#2dd4ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030812" stop-opacity=".0"/><stop offset="1" stop-color="#030812" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2dd4ff" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><path d="M190 400H970" fill="none" stroke="#2dd4ff" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="52;0" dur="3s" begin="0s" repeatCount="indefinite" /></path><circle cx="190" cy="400" r="56" fill="none" stroke="#2dd4ff" stroke-width="3"><animate attributeName="r" values="56;145.6" dur="3s" begin="0.0s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="3s" begin="0.0s" repeatCount="indefinite" /></circle><circle cx="190" cy="400" r="56" fill="#061427" stroke="#2dd4ff" stroke-width="5"/><text x="190" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#2dd4ff" opacity="1">1</text><text x="190" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" opacity="1">Detect</text><text x="190" y="560" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b6cde6" opacity="1">AI finds a threat</text><circle cx="450" cy="400" r="56" fill="none" stroke="#fbbf24" stroke-width="3"><animate attributeName="r" values="56;145.6" dur="3s" begin="0.6s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="3s" begin="0.6s" repeatCount="indefinite" /></circle><circle cx="450" cy="400" r="56" fill="#061427" stroke="#fbbf24" stroke-width="5"/><text x="450" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#fbbf24" opacity="1">2</text><text x="450" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" opacity="1">Verify</text><text x="450" y="560" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b6cde6" opacity="1">Human confirms</text><circle cx="710" cy="400" r="56" fill="none" stroke="#ff4d5e" stroke-width="3"><animate attributeName="r" values="56;145.6" dur="3s" begin="1.2s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="3s" begin="1.2s" repeatCount="indefinite" /></circle><circle cx="710" cy="400" r="56" fill="#061427" stroke="#ff4d5e" stroke-width="5"/><text x="710" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#ff4d5e" opacity="1">3</text><text x="710" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" opacity="1">Alert</text><text x="710" y="560" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b6cde6" opacity="1">SaveAlert pushed</text><circle cx="970" cy="400" r="56" fill="none" stroke="#34d399" stroke-width="3"><animate attributeName="r" values="56;145.6" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite" /></circle><circle cx="970" cy="400" r="56" fill="#061427" stroke="#34d399" stroke-width="5"/><text x="970" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#34d399" opacity="1">4</text><text x="970" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" opacity="1">Respond</text><text x="970" y="560" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b6cde6" opacity="1">Police and staff</text><rect width="1200" height="800" fill="url(#vig)"/></svg>