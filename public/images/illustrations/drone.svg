<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="UAV drone camera"><title>UAV drone camera</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset=".55" stop-color="#0a2140"/><stop offset="1" stop-color="#0b3a5e"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#06101d"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a47"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa5bd"/><stop offset=".5" stop-color="#4b6179"/><stop offset="1" stop-color="#26374b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c42"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3150"/><stop offset="1" stop-color="#061427"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#2dd4ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030812" stop-opacity=".0"/><stop offset="1" stop-color="#030812" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2dd4ff" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><ellipse cx="600" cy="430" rx="380" ry="260" fill="url(#glow)"/><g filter="url(#shadow)"><line x1="330" y1="330" x2="600" y2="420" stroke="#5d7390" stroke-width="16" stroke-linecap="round"/><ellipse cx="330" cy="305" rx="110" ry="14" fill="#9fb4cc" opacity=".55"><animate attributeName="rx" values="110;60;110" dur=".25s" repeatCount="indefinite"/></ellipse><rect x="322" y="305" width="16" height="30" fill="#2a3b50"/><line x1="870" y1="330" x2="600" y2="420" stroke="#5d7390" stroke-width="16" stroke-linecap="round"/><ellipse cx="870" cy="305" rx="110" ry="14" fill="#9fb4cc" opacity=".55"><animate attributeName="rx" values="110;60;110" dur=".25s" repeatCount="indefinite"/></ellipse><rect x="862" y="305" width="16" height="30" fill="#2a3b50"/><rect x="500" y="380" width="200" height="90" rx="30" fill="url(#metal)"/><circle cx="600" cy="500" r="34" fill="#05101c" stroke="#3a5675" stroke-width="6"/><circle cx="600" cy="500" r="16" fill="#0d3150"/></g><path d="M600 520 L430 740 L770 740 Z" fill="#2dd4ff" opacity=".14"/><g><rect x="520" y="640" width="160" height="100" fill="#ff4d5e" fill-opacity=".10"><animate attributeName="fill-opacity" values=".05;.25;.05" dur="1.6s" begin="0s" repeatCount="indefinite" /></rect><path d="M520 666V640H546 M654 640H680V666 M680 714V740H654 M546 740H520 714" fill="none" stroke="#ff4d5e" stroke-width="5" stroke-linecap="round"><animate attributeName="stroke-width" values="4;7;4" dur="1.6s" begin="0s" repeatCount="indefinite" /></path><rect x="520" y="596" width="112" height="38" rx="6" fill="#ff4d5e"/><text x="534" y="623" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#fff">Threat</text></g><circle cx="600" cy="500" r="30" fill="none" stroke="#2dd4ff" stroke-width="3"><animate attributeName="r" values="30;78.0" dur="2.4s" begin="0s" repeatCount="indefinite" /><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="0s" repeatCount="indefinite" /></circle><rect width="1200" height="800" fill="url(#vig)"/></svg>