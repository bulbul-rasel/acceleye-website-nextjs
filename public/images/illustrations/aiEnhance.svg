<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="AI-enhanced BTAM"><title>AI-enhanced BTAM</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset=".55" stop-color="#0a2140"/><stop offset="1" stop-color="#0b3a5e"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324f"/><stop offset="1" stop-color="#06101d"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a47"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa5bd"/><stop offset=".5" stop-color="#4b6179"/><stop offset="1" stop-color="#26374b"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c42"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3150"/><stop offset="1" stop-color="#061427"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4ff" stop-opacity="0"/><stop offset="1" stop-color="#2dd4ff" stop-opacity=".55"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2dd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#fbbf24" stop-opacity=".7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030812" stop-opacity=".0"/><stop offset="1" stop-color="#030812" stop-opacity=".55"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2dd4ff" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
</defs><rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)"/><circle cx="600" cy="400" r="190" fill="url(#glow)"/><circle cx="600" cy="400" r="120" fill="#07162a" stroke="#2dd4ff" stroke-width="4"/><text x="600" y="420" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" fill="#2dd4ff" opacity="1">AI</text><path d="M600 400 L910.0 400.0" fill="none" stroke="#2dd4ff" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="52;0" dur="2.0s" begin="0s" repeatCount="indefinite" /></path><circle cx="910.0" cy="400.0" r="58" fill="#061427" stroke="#2dd4ff" stroke-width="4"/><text x="910.0" y="408.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" opacity="1">Observe</text><path d="M600 400 L600.0 630.0" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="52;0" dur="2.3s" begin="0s" repeatCount="indefinite" /></path><circle cx="600.0" cy="630.0" r="58" fill="#061427" stroke="#fbbf24" stroke-width="4"/><text x="600.0" y="638.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" opacity="1">Assess</text><path d="M600 400 L290.0 400.0" fill="none" stroke="#ff4d5e" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="52;0" dur="2.6s" begin="0s" repeatCount="indefinite" /></path><circle cx="290.0" cy="400.0" r="58" fill="#061427" stroke="#ff4d5e" stroke-width="4"/><text x="290.0" y="408.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" opacity="1">Intervene</text><path d="M600 400 L599.9999999999999 170.0" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="52;0" dur="2.9s" begin="0s" repeatCount="indefinite" /></path><circle cx="599.9999999999999" cy="170.0" r="58" fill="#061427" stroke="#34d399" stroke-width="4"/><text x="599.9999999999999" y="178.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" opacity="1">Follow-up</text><rect width="1200" height="800" fill="url(#vig)"/></svg>